<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Cecilia 💘 Alessandro</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffb3d9, #ff4d6d);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Pacifico', cursive;
}

.container {
  text-align: center;
}

h1 {
  font-family: 'Luckiest Guy', cursive;
  font-size: 3.2em;
  color: white;
  text-shadow: 0 0 10px rgba(255,255,255,0.6);
  animation: pulse 1.3s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

button {
  font-size: 1.8em;
  padding: 15px 45px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-family: 'Pacifico', cursive;
}

#si {
  background: white;
  color: #ff4d6d;
  margin-right: 20px;
}

#no {
  background: #ddd;
  position: absolute;
}

.finale {
  display: none;
  flex-direction: column;
  align-items: center;
  color: white;
  text-align: center;
}

.cuore {
  position: fixed;
  font-size: 24px;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-10vh); }
  100% { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div class="container" id="domanda">
  <h1>Alessandro,<br>vuoi essere il mio Valentino? 💖</h1>
  <button id="si">SÌ 😍</button>
  <button id="no">NO 🙄</button>
</div>

<div class="finale" id="finale">
  <h1>🐱💋🐱</h1>
  <h1>I meow you 💖</h1>
  <h2>– Cecilia</h2>
</div>

<script>
const noBtn = document.getElementById("no");
const siBtn = document.getElementById("si");
const domanda = document.getElementById("domanda");
const finale = document.getElementById("finale");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

siBtn.addEventListener("click", () => {
  domanda.style.display = "none";
  finale.style.display = "flex";
  pioggiaCuori();
});

function pioggiaCuori() {
  setInterval(() => {
    const cuore = document.createElement("div");
    cuore.className = "cuore";
    cuore.innerHTML = Math.random() > 0.5 ? "💖" : "🐾";
    cuore.style.left = Math.random() * 100 + "vw";
    cuore.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(cuore);
    setTimeout(() => cuore.remove(), 5000);
  }, 250);
}
</script>

</body>
</html>
